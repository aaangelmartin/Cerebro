<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazaar · Supervisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="static/styles.css">
<link rel="stylesheet" href="screens/home.css">
<link rel="stylesheet" href="screens/cerebro.css">

<link rel="stylesheet" href="screens/laboratorio.css">

</head>
<body>
<header class="topbar">
  <a class="brand" href="#home"><span class="brand-mark">B</span><span class="brand-name">Bazaar</span></a>
  <div class="tb-stats" id="tb-stats"></div>
  <div class="tb-wall" id="tb-wall"></div>
  <div class="tb-clock" id="tb-clock"></div>
  <button id="refresh" class="bell refresh" type="button" data-i18n-aria="shell.refreshNow" data-i18n-title="shell.refreshNow" aria-label="Actualizar ahora" title="Actualizar ahora">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button id="bell" class="bell" type="button" data-i18n-aria="shell.alerts" aria-label="Avisos">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    <span id="bell-count" class="bell-count num" hidden>0</span>
  </button>
</header>
<div id="bell-panel" class="bell-panel" hidden></div>
<div class="layout">
  <nav class="sidenav" data-i18n-aria="shell.menu" aria-label="Menú">
    <div id="nav-list" class="nav-list"></div>
    <div id="status-box" class="status-box"></div>
    <div id="lang-switch" class="lang-switch" role="group"></div>
  </nav>
  <div class="main-wrap">
    <div id="banners" class="banners"></div>
    <main id="screen" class="screen"></main>
    <div id="closed-overlay" class="closed-overlay" hidden></div>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="static/i18n.js"></script>
<script src="static/i18n-common.js"></script>
<script src="static/i18n-shell.js"></script>

<script src="static/i18n-rivales.js"></script>
<script src="static/i18n-supervision.js"></script>
<script src="static/i18n-laboratorio.js"></script>
<script src="static/i18n-bot.js"></script>
<script src="static/i18n-cerebro.js"></script>
<script src="static/i18n-broker.js"></script>
<script src="static/i18n-radio.js"></script>
<script src="static/ui.js"></script>
<script src="static/api.js"></script>
<script src="screens/home.js"></script>
<script src="screens/cerebro.js"></script>
<script src="screens/radio.js"></script>
<script src="screens/coleccion.js"></script>
<script src="screens/mercado.js"></script>
<script src="screens/broker.js"></script>
<script src="screens/duelos.js"></script>
<script src="screens/competicion.js"></script>
<script src="screens/rivales.js"></script>
<script src="screens/supervision.js"></script>
<script src="screens/laboratorio.js"></script>
<script src="screens/bot.js"></script>
<script src="static/app.js"></script>
</body>
</html>
