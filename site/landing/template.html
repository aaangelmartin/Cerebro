<style>
*,*::before,*::after{box-sizing:border-box;margin:0;border-radius:0}
:root{
  --bg:#08090B;--s1:#0E1013;--s2:#14171B;--s3:#1C2026;--line:#1F2329;--line-2:#2D323A;
  --ink:#ECEEF0;--ink-2:#A4ABB3;--ink-3:#6A727B;--ok:#45B883;--bad:#E2564D;--warn:#E5BE4F;--info:#4C9BE8;
  --signal:#F4F1EA;--legendary:#FFC44D;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--font-num:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --pad:clamp(16px,4.4vw,72px);--gap:clamp(8px,1vw,12px);color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
body{height:100vh;height:100dvh}
a{color:inherit;text-decoration:none}
main{height:100%;max-width:1560px;max-height:1000px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:var(--gap);padding:clamp(12px,2.8vh,36px) var(--pad);position:relative;top:50%;transform:translateY(-50%)}

/* The winner poster: the README banner rebuilt as a component. Every size is a share of the panel, as in the 1600x360 original. */
.poster{position:relative;flex:none;aspect-ratio:4.2 / 1;min-height:170px;max-height:37dvh;container-type:size;background:var(--s1);border:1px solid var(--line-2);overflow:hidden;isolation:isolate}
.poster .grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.5}
.poster .glow{position:absolute;right:-4cqw;top:-40cqh;width:63cqw;height:180cqh;background:radial-gradient(closest-side,rgba(255,196,77,.30),rgba(255,196,77,.08) 55%,transparent 75%)}
.poster .fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--s1) 0%,var(--s1) 40%,rgba(14,16,19,.4) 62%,transparent 80%)}
.poster .bar{position:absolute;left:0;top:0;bottom:0;width:clamp(5px,.5cqw,8px);background:var(--legendary);z-index:60;transform-origin:50% 0}
.words{position:absolute;left:4.5cqw;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:min(5cqh,1.125cqw);z-index:50}
.tagwrap{align-self:flex-start;overflow:hidden;display:block}
.tag{display:inline-flex;align-items:center;gap:.66em;font-family:var(--font-num);font-weight:600;font-size:min(5.83cqh,1.3125cqw);letter-spacing:.16em;color:var(--s1);background:var(--legendary);padding:.43em .76em;white-space:nowrap}
.tag i{width:.48em;height:.48em;background:var(--s1);display:block;flex:none}
h1{font-size:min(28.9cqh,6.5cqw);font-weight:800;letter-spacing:-.035em;line-height:.9;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em;display:flex}
h1 .w{display:block}
h1 .d{display:block;color:var(--legendary)}
.sub{font-size:min(9.44cqh,2.125cqw);font-weight:600;letter-spacing:-.01em}
.meta{font-family:var(--font-num);font-size:min(4.72cqh,1.0625cqw);letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase;white-space:nowrap}
.cards{position:absolute;right:2.75cqw;top:50%;transform:translateY(-50%);display:flex;align-items:center;--cw:min(8.75cqw,38.9cqh);z-index:40}
/* Cards are opaque at every moment: they are only ever moved, never faded. */
.c{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);margin-left:calc(var(--cw)*-.143);border:2px solid var(--legendary);background:var(--s2);box-shadow:0 0 0 1px var(--s1),0 14px 34px rgba(0,0,0,.6),0 0 26px rgba(255,196,77,.28);transform-origin:50% 120%;transform:translateY(calc(var(--y)*var(--cw)/140)) rotate(var(--r));transition:transform .22s cubic-bezier(.2,.75,.2,1);overflow:hidden}
.c:first-child{margin-left:0}
.c svg{width:100%;height:100%;display:block;position:relative}
.c .sheen{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,236,190,.34) 50%,transparent 58%);transform:translateX(-130%)}
.c:hover{transform:translateY(calc((var(--y) - 16)*var(--cw)/140)) rotate(0deg) scale(1.05);z-index:30 !important}
/*__CSS__*/
</style>
